name: ChibiDoll
options:
  bundleIdPrefix: com.chibidoll
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone, iPad
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  ChibiDoll:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChibiDoll
    settings:
      base:
        PRODUCT_NAME: ChibiDoll
        PRODUCT_BUNDLE_IDENTIFIER: com.chibidoll.dressup
        INFOPLIST_KEY_CFBundleDisplayName: "Chibi Doll"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save your adorable Chibi dolls to Photos"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        GENERATE_INFOPLIST_FILE: true

  ChibiDollTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChibiDollTests
    dependencies:
      - target: ChibiDoll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chibidoll.dressup.tests
        GENERATE_INFOPLIST_FILE: true

